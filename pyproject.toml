[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "separador-vocal"
version = "0.1.0"
description = "Aplicación local para separar voz principal, coros y acompañamiento."
requires-python = ">=3.11,<3.14"
dependencies = [
    "PySide6-Essentials>=6.7,<7",
    "mutagen>=1.47,<2",
]

[project.optional-dependencies]
separation-cpu = [
    "audio-separator[cpu]==0.47.0",
    "audioread>=3,<4",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
vocal_splitter = ["infrastructure/separation/*.json"]
