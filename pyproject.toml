[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "separador-vocal"
version = "0.0.1"
description = "Aplicación local para separar cinco stems y mezclar pistas de audio."
requires-python = ">=3.11,<3.14"
dependencies = [
    "PySide6-Essentials>=6.7,<7",
    "mutagen>=1.47,<2",
    "numpy>=1.26,<3",
    "soundfile>=0.12,<1",
]

[project.optional-dependencies]
separation-cpu = [
    "audio-separator[cpu]==0.47.0",
    "audioread>=3,<4",
]
playback = [
    "sounddevice>=0.5,<1",
]
desktop = [
    "sounddevice>=0.5,<1",
    "pyinstaller>=6.10,<7",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
vocal_splitter = ["infrastructure/separation/*.json"]
